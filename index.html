<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weltkarte - Städteverbindungen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        h1 {
            margin: 20px 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #mapContainer {
            position: relative;
            background: #1a1a2e;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            margin: 20px 0;
        }

        canvas {
            display: block;
            background: #0f3460;
        }

        #controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #berlinBtn {
            background: linear-gradient(135deg, #e94560, #c41e3a);
            color: white;
        }

        #berlinBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(233, 69, 96, 0.5);
        }

        #randomBtn {
            background: linear-gradient(135deg, #16a085, #0fb896);
            color: white;
        }

        #randomBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 160, 133, 0.5);
        }

        #clearBtn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }

        #clearBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        #info {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>🌍 Interaktive Weltkarte</h1>

    <div id="mapContainer">
        <canvas id="worldMap"></canvas>
    </div>

    <div id="controls">
        <button id="berlinBtn">Berlin Verbinden</button>
        <button id="randomBtn">Zufällige Verbindung</button>
        <button id="clearBtn">Karte Leeren</button>
    </div>

    <div id="info">
        <p>Klicke auf "Berlin Verbinden" um Berlin mit einer zufälligen Stadt zu verbinden</p>
        <p>Oder nutze "Zufällige Verbindung" für beliebige Städteverbindungen</p>
    </div>

    <script src="javascripts/worldmap.js"></script>
</body>
</html>
